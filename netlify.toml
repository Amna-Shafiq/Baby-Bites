[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection          = "0"
    Content-Security-Policy   = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://fonts.cdnfonts.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com https://api.fontshare.com https://cdn.fontshare.com; img-src 'self' data: blob: https://res.cloudinary.com https://flagcdn.com https://placehold.co https://*.supabase.co https://spoonacular.com https://images.unsplash.com https://pub-fa59902d9c914df3be6d8860cdc82704.r2.dev; media-src 'self' https://res.cloudinary.com https://pub-fa59902d9c914df3be6d8860cdc82704.r2.dev; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://formspree.io; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io;"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
